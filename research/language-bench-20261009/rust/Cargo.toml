[package]
name = "aquilum_scan_bench"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.105"
memchr = "2.7.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.wasm-pack.profile.release]
# Current rustc emits bulk-memory operations; wasm-opt must validate them.
wasm-opt = ["-O", "--enable-bulk-memory"]
