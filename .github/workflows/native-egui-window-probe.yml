name: Aquilum Native OS Window (experimental)

on:
  pull_request:
    paths:
      - 'aquilum-app/native-desktop/**'
      - '.github/workflows/native-egui-window-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-os-window:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile real eframe/winit OS-window binary
        run: cargo check --manifest-path aquilum-app/native-desktop/Cargo.toml
      - name: Test native input event routing
        run: cargo test --manifest-path aquilum-app/native-desktop/Cargo.toml -- --test-threads=1

      - name: Link experimental native Windows executable
        if: matrix.os == 'windows-latest'
        run: cargo build --manifest-path aquilum-app/native-desktop/Cargo.toml
      - name: Publish experimental native Windows executable and checksum
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = 'aquilum-app/native-desktop/target/debug/aquilum-native-desktop.exe'
          if (!(Test-Path $exe)) { throw "Real native executable was not created" }
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash
          "AQUILUM_NATIVE_WINDOWS_BINARY_SHA256 $hash"
          "$hash  aquilum-native-desktop.exe" | Out-File -FilePath 'aquilum-app/native-desktop/preview.sha256' -Encoding ascii
      - name: Upload Windows native OS-window preview
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: aquilum-native-desktop-windows-preview
          path: |
            aquilum-app/native-desktop/target/debug/aquilum-native-desktop.exe
            aquilum-app/native-desktop/preview.sha256
          if-no-files-found: error

      - name: Launch and paint an actual Linux OS window in Xvfb
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run
          # Github runner has Xvfb but does not preload xkbcommon's X11 shim.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libxkbcommon-x11-0
          vault="$(mktemp -d)"
          trap 'rm -rf "$vault"' EXIT
          printf '# Native Smoke\nTest document.\n' > "$vault/Smoke.md"
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout 120s cargo run             --manifest-path aquilum-app/native-desktop/Cargo.toml             -- "$vault/Smoke.md" --app-data "$vault/app-data" --smoke-launch             2>&1 | tee native-os-window-smoke.log
          grep -q 'AQUILUM_NATIVE_OS_WINDOW_SMOKE frames=' native-os-window-smoke.log
      - name: Preserve resolved prototype dependency lock for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-desktop-lock-${{ matrix.os }}
          path: aquilum-app/native-desktop/Cargo.lock
          if-no-files-found: warn
